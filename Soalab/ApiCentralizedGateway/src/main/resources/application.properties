
spring.application.name=ApiCentralizedGateway
server.port=8080

# Inventory Service Route
spring.cloud.gateway.server.webflux.routes[0].id=inventory
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/inventory/**

# Shipping Service Route
spring.cloud.gateway.server.webflux.routes[1].id=shipping
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/shipping/**